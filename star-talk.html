<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco-City Builder 🌍</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #14152b;
  --surface: #1d1f3d;
  --card: #262a52;
  --accent1: #f472b6;
  --accent2: #fbbf24;
  --accent3: #2dd4bf;
  --accent4: #818cf8;
  --text: #f3f4f6;
  --muted: #9ca3af;
  --radius: 20px;
  --shadow: 0 8px 30px rgba(0,0,0,0.4);

  /* city palette */
  --sun-dull:     #c9c2a8;
  --sun-bright:   #ffd54f;
  --hill:         #6b8f5a;
  --hill-dark:    #547147;
  --road:         #5b6570;
  --sidewalk:     #8d99a6;
  --concrete:     #9aa1a6;
  --grass:        #66bb6a;
  --river-dirty:  #8a8564;
  --river-clean:  #29b6f6;
  --building1:    #78909c;
  --building2:    #8d9ea8;
  --building3:    #6d8189;
  --roof:         #546e7a;
  --litter:       #5d4037;
  --bike-lane:    #ffca28;
}

html, body {
  height: 100%;
  font-family: 'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  user-select: none;
  overflow-x: hidden;
}

.screen { display: none; min-height: 100vh; padding: 20px; }
.screen.active { display: flex; flex-direction: column; align-items: center; }
.hidden { display: none !important; }

/* ===================== START SCREEN ===================== */
#screen-start {
  background: radial-gradient(circle at 20% 20%, #2a2d5c 0%, #14152b 60%);
  justify-content: center;
  gap: 28px;
}
.logo {
  font-size: clamp(2.3rem, 7vw, 4.4rem);
  font-weight: 900;
  letter-spacing: -2px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.2em;
  text-align: center;
}
/* the gradient is clipped to the text only — an emoji inside it would lose its own colours */
.logo-text {
  background: linear-gradient(90deg, var(--accent2), var(--accent1), var(--accent4));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.goal-card {
  background: linear-gradient(135deg, var(--card), var(--surface));
  border: 3px solid var(--accent3);
  border-radius: var(--radius);
  padding: 20px 30px;
  max-width: min(92vw, 620px);
  text-align: center;
  box-shadow: var(--shadow);
}
.goal-title { font-size: 1.45rem; font-weight: 900; margin-bottom: 10px; }
.goal-text { color: var(--muted); font-size: 1.05rem; line-height: 1.6; font-weight: 600; }
.goal-text strong { color: var(--accent3); }

.class-picker { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.class-name { font-size: 2.2rem; font-weight: 800; line-height: 1; }
.class-progress { display: flex; flex-direction: column; gap: 3px; font-size: 0.95rem; font-weight: 700; }
.class-progress .lvl { color: var(--accent3); }
.class-progress .pts { color: var(--accent2); }
.class-go {
  margin-top: 4px;
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: 0;
  color: var(--text);
  background: linear-gradient(135deg, var(--accent1), var(--accent4));
  padding: 10px 26px;
  border-radius: 999px;
}
.class-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  min-width: 190px;
  font-weight: 800;
  padding: 24px 40px;
  border-radius: var(--radius);
  border: none;
  background: linear-gradient(135deg, var(--card), var(--surface));
  color: var(--text);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s ease;
  border: 3px solid transparent;
}
.class-btn:hover { transform: translateY(-4px) scale(1.03); border-color: var(--accent3); }
.class-btn:active { transform: scale(0.96); }

/* ===================== MAIN SCREEN ===================== */
#screen-main { justify-content: flex-start; gap: 18px; padding: 16px; }

.topbar {
  width: 100%;
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.icon-btn {
  font-size: 1.4rem;
  background: var(--surface);
  border: none;
  color: var(--text);
  width: 48px; height: 48px;
  border-radius: 14px;
  cursor: pointer;
}
.icon-btn:hover { background: var(--card); }
.class-label {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--accent4);
}

.jar-wrap { display: flex; align-items: center; gap: 12px; }
.jar {
  width: 54px; height: 70px;
  border: 3px solid var(--accent2);
  border-radius: 10px 10px 16px 16px;
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
}
.jar-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 0%;
  background: linear-gradient(180deg, #fde68a, #fbbf24);
  transition: height 0.6s cubic-bezier(.34,1.56,.64,1);
}
.jar-info { display: flex; flex-direction: column; font-size: 0.95rem; font-weight: 700; }
#jar-total { color: var(--accent2); }
#jar-badges { color: var(--muted); font-size: 0.85rem; }

.called-counter {
  font-size: 0.95rem;
  color: var(--muted);
  background: var(--surface);
  padding: 6px 16px;
  border-radius: 999px;
}

.stage {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  margin-top: 16px;
}

.big-btn {
  font-size: 2rem;
  font-weight: 900;
  padding: 50px 70px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, var(--accent1), var(--accent4));
  color: #fff;
  box-shadow: 0 10px 40px rgba(129,140,248,0.4);
  cursor: pointer;
  transition: transform 0.15s ease;
}
.big-btn:hover { transform: translateY(-4px) scale(1.02); }
.big-btn:active { transform: scale(0.96); }

.student-number {
  font-size: clamp(6rem, 22vw, 11rem);
  font-weight: 900;
  color: var(--accent2);
  text-shadow: 0 0 40px rgba(251,191,36,0.5);
  line-height: 1;
}
.student-number.rolling { animation: rollShake 0.12s linear infinite; filter: blur(1px); }
@keyframes rollShake {
  0%, 100% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.06) rotate(-4deg); }
  75% { transform: scale(0.95) rotate(4deg); }
}
.student-number.landed { animation: landBounce 0.55s cubic-bezier(.34,1.56,.64,1); }
.student-id { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.3rem; font-weight: 700; min-height: 46px; }
.student-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; box-shadow: var(--shadow);
}
.student-photo { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; box-shadow: var(--shadow); }
@keyframes landBounce {
  0% { transform: scale(0.4) rotate(-8deg); }
  55% { transform: scale(1.3) rotate(4deg); }
  75% { transform: scale(0.9) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.ghost-btn {
  font-size: 1rem;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 14px;
  border: 2px solid var(--card);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.ghost-btn:hover { border-color: var(--accent3); color: var(--text); }

.mode-picker {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}
.mode-btn {
  font-size: 1.15rem;
  font-weight: 800;
  padding: 22px 28px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  color: #fff;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease;
  min-width: 170px;
}
.mode-btn:hover { transform: translateY(-3px); }
.mode-btn:active { transform: scale(0.96); }
.mode-btn.easy { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
.mode-btn.medium { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.mode-btn.hard { background: linear-gradient(135deg, #f87171, #ef4444); }
.mode-btn.mistake { background: linear-gradient(135deg, #eab308, #a16207); }
.mode-btn.order { background: linear-gradient(135deg, #c084fc, #9333ea); }

.question-badge {
  font-size: 1rem;
  font-weight: 800;
  padding: 6px 18px;
  border-radius: 999px;
  background: var(--card);
  color: var(--accent2);
}

/* ---- picture / visual aid ---- */
#question-visual { display: flex; justify-content: center; min-height: 40px; }
.emoji-visual { font-size: 4rem; line-height: 1; text-align: center; }
.scene-box {
  position: relative;
  width: 220px; height: 160px;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
}
.scene-emoji { position: absolute; line-height: 1; }
.repeat-row {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  max-width: 380px; font-size: 2.3rem;
}
.color-card {
  width: 130px; height: 130px;
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 3.4rem;
  box-shadow: var(--shadow);
}
.number-card { display: flex; align-items: center; gap: 14px; }
.number-emoji { font-size: 3rem; }
.number-value { font-size: 3.2rem; font-weight: 900; color: var(--accent2); }

.question-card {
  font-size: clamp(1.6rem, 4.4vw, 2.5rem);
  font-weight: 800;
  text-align: center;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 34px 30px;
  max-width: 800px;
  box-shadow: var(--shadow);
  line-height: 1.35;
}

/* ---- sentence hint chips ---- */
.hint-row {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  max-width: 700px;
}
.hint-chip {
  font-size: 1.25rem;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 12px;
  background: transparent;
  border: 2px dashed var(--card);
  color: var(--muted);
  min-width: 20px;
  text-align: center;
}
.hint-chip.revealed {
  background: linear-gradient(135deg, var(--accent3), #14b8a6);
  border: 2px solid transparent;
  color: #08221c;
}

.question-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.judge-controls { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.judge-btn {
  font-size: 1.4rem;
  font-weight: 900;
  padding: 22px 40px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  color: #fff;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease;
}
.judge-btn:hover { transform: translateY(-3px); }
.judge-btn:active { transform: scale(0.95); }
.judge-btn.correct { background: linear-gradient(135deg, #4ade80, #22c55e); }
.judge-btn.skip { background: linear-gradient(135deg, #6b7280, #4b5563); }

/* ===================== MODAL ===================== */
.modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
}
.modal-box {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 30px;
  width: min(90vw, 380px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.modal-box h3 { font-size: 1.3rem; }
.modal-btn {
  font-size: 1rem;
  font-weight: 700;
  padding: 14px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  background: var(--card);
  color: var(--text);
}
.modal-btn.danger { background: #7f1d1d; color: #fecaca; }
.modal-btn:hover { filter: brightness(1.15); }

/* ===================== ECO-CITY SVG LAYERS ===================== */
/* All scoped to #cityscape. The flag classes (trash-gone … city-clean) are toggled by
   applyCityLayers(); everything else is idle animation that makes the scene feel alive. */
#cityscape .sky-dirty { opacity: 1; transition: opacity 1.6s ease; }
#cityscape .sky-clean { opacity: 0; transition: opacity 1.6s ease; }
#cityscape.city-clean .sky-dirty { opacity: 0; }
#cityscape.city-clean .sky-clean { opacity: 1; }

#cityscape .sun { fill: var(--sun-dull); transition: fill 1.4s ease; }
#cityscape.city-clean .sun { fill: var(--sun-bright); filter: url(#sunGlow); }
#cityscape .sun-rays {
  opacity: 0;
  transform-box: fill-box; transform-origin: center;
  transition: opacity 1.4s ease;
  animation: sunSpin 70s linear infinite;
}
#cityscape.city-clean .sun-rays { opacity: 1; }
#cityscape .sun-face { opacity: 0; transition: opacity 1.2s ease 0.7s; }
#cityscape.city-clean .sun-face { opacity: 1; }
@keyframes sunSpin { to { transform: rotate(360deg); } }

#cityscape .smog { opacity: 0.9; transition: opacity 1.8s ease; }
#cityscape.city-clean .smog { opacity: 0; }
#cityscape .chimney { opacity: 1; transition: opacity 1.2s ease; }
#cityscape.city-clean .chimney { opacity: 0; }
#cityscape .puff {
  transform-box: fill-box; transform-origin: center;
  animation: puffRise 4.5s ease-out infinite;
}
@keyframes puffRise {
  0%   { transform: translateY(0) scale(0.5); opacity: 0.85; }
  100% { transform: translateY(-130px) scale(1.7); opacity: 0; }
}

/* clouds and birds arrive with the clean sky */
#cityscape .clouds, #cityscape .birds { opacity: 0; transition: opacity 1.8s ease; }
#cityscape.city-clean .clouds, #cityscape.city-clean .birds { opacity: 1; }
#cityscape .cloud { animation: cloudDrift 50s ease-in-out infinite alternate; }
@keyframes cloudDrift { to { transform: translateX(80px); } }
#cityscape .bird { animation: birdFly 30s linear infinite; }
@keyframes birdFly { from { transform: translateX(-180px); } to { transform: translateX(1780px); } }

/* drab concrete town -> friendly coloured houses */
#cityscape .bld { transition: fill 1.6s ease; }
#cityscape .bld-1 { fill: var(--building1); }
#cityscape .bld-2 { fill: var(--building2); }
#cityscape .bld-3 { fill: var(--building3); }
#cityscape.city-clean .bld-1 { fill: #ef8b63; }
#cityscape.city-clean .bld-2 { fill: #f3b441; }
#cityscape.city-clean .bld-3 { fill: #6fb98f; }
#cityscape .roof { fill: var(--roof); transition: fill 1.6s ease; }
#cityscape.city-clean .roof { fill: #6d5a52; }

#layer-trash { opacity: 1; transition: opacity 0.7s ease, transform 0.7s ease; }
#cityscape.trash-gone #layer-trash { opacity: 0; transform: translateY(16px) scale(0.7); }

#layer-tree, #layer-flower, #layer-bike, #layer-bin, #layer-solar, #layer-turbine {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0.5) translateY(14px);
  transition: opacity 0.8s cubic-bezier(0.34,1.56,0.64,1), transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
#cityscape.tree-on    #layer-tree,
#cityscape.flower-on  #layer-flower,
#cityscape.bike-on    #layer-bike,
#cityscape.bin-on     #layer-bin,
#cityscape.solar-on   #layer-solar,
#cityscape.turbine-on #layer-turbine {
  opacity: 1; transform: scale(1) translateY(0);
}

#cityscape .park-ground { fill: var(--concrete); transition: fill 1.2s ease; }
#cityscape.park-on .park-ground { fill: var(--grass); }
#cityscape .park-details { opacity: 0; transition: opacity 1s ease 0.2s; }
#cityscape.park-on .park-details { opacity: 1; }

/* the river sits in the foreground and is drawn last, so nothing can cover it */
#cityscape .river-fill { fill: var(--river-dirty); transition: fill 1.6s ease; }
#cityscape.river-on .river-fill { fill: var(--river-clean); }
#cityscape .river-scum { opacity: 1; transition: opacity 1.4s ease; }
#cityscape.river-on .river-scum { opacity: 0; }
#cityscape .ripple { opacity: 0; transition: opacity 1.2s ease 0.4s; }
#cityscape.river-on .ripple { opacity: 0.6; }
#cityscape .fish { opacity: 0; transition: opacity 1s ease 0.5s; }
/* the fish emoji faces left, so they swim right-to-left or they look like they are
   going backwards */
#cityscape.river-on .fish { opacity: 1; animation: swim 17s linear infinite; }
@keyframes swim { from { transform: translateX(1740px); } to { transform: translateX(-140px); } }

#cityscape .butterfly {
  transform-box: fill-box; transform-origin: center;
  animation: flutter 3.6s ease-in-out infinite alternate;
}
@keyframes flutter {
  from { transform: translate(0, 0) rotate(-8deg); }
  to   { transform: translate(20px, -26px) rotate(10deg); }
}

#cityscape .turbine-blades {
  transform-box: fill-box; transform-origin: center;
  animation: citySpin 3.2s linear infinite;
}
@keyframes citySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===================== ECO-CITY OVERLAY ===================== */
#city-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 55;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
}
.city-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.city-title { font-size: 1.5rem; font-weight: 900; white-space: nowrap; }
.city-progress { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 200px; }
.city-bar { flex: 1; height: 22px; background: var(--card); border-radius: 999px; overflow: hidden; min-width: 80px; }
.city-bar-fill {
  height: 100%; width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #4ade80, #a3e635, #fbbf24);
  transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#city-level-text { font-weight: 800; white-space: nowrap; }
#city-built-text { color: var(--accent2); font-weight: 800; white-space: nowrap; }
.city-stage {
  flex: 1; position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  min-height: 0;
}
#cityscape { width: 100%; height: 100%; display: block; }
.city-banner {
  position: absolute; left: 50%; bottom: 24px;
  transform: translateX(-50%);
  background: rgba(20, 21, 43, 0.92);
  border: 3px solid var(--accent3);
  border-radius: var(--radius);
  padding: 16px 32px;
  font-size: clamp(1.1rem, 2.4vw, 1.8rem);
  font-weight: 900;
  text-align: center;
  animation: bannerIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.city-banner small { display: block; margin-top: 6px; font-weight: 700; color: var(--muted); font-size: 0.65em; }

/* ---- demo mode ---- */
.demo-badge {
  background: var(--accent1);
  color: #14152b;
  font-weight: 900;
  font-size: 0.85rem;
  letter-spacing: 1px;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
}
.demo-bar {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.demo-btn {
  font-size: 1rem;
  font-weight: 800;
  padding: 12px 20px;
  border-radius: 14px;
  border: 2px solid var(--card);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: transform 0.12s ease, filter 0.15s ease;
}
.demo-btn:hover { filter: brightness(1.25); transform: translateY(-2px); }
.demo-btn:active { transform: scale(0.96); }
.demo-btn.primary { background: linear-gradient(135deg, var(--accent1), var(--accent4)); border-color: transparent; }
.city-banner-emoji { font-size: 1.3em; }
@keyframes bannerIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.9); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

/* ===================== TOAST ===================== */
.toast {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 700;
  box-shadow: var(--shadow);
  z-index: 60;
  animation: toastIn 0.3s ease;
}
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(-20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

/* ===================== FLOATING STARS ===================== */
.float-star {
  position: fixed;
  font-size: 2rem;
  pointer-events: none;
  z-index: 70;
  animation: floatUp 1.1s ease-out forwards;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-160px) scale(1.4); opacity: 0; }
}

/* ===================== CONFETTI ===================== */
.confetti-piece {
  position: fixed;
  top: -20px;
  font-size: 1.6rem;
  pointer-events: none;
  z-index: 65;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(105vh) rotate(360deg); opacity: 0.3; }
}

@media (max-width: 600px) {
  .student-number { font-size: 5.5rem; }
  .big-btn { padding: 36px 40px; font-size: 1.5rem; }
}
</style>
</head>
<body>

<!-- ══════════════════ START SCREEN ══════════════════ -->
<div id="screen-start" class="screen active">
  <div class="logo"><span>🌍</span><span class="logo-text">Eco-City Builder</span></div>

  <div class="goal-card">
    <div class="goal-title">🌍 Our class goal: build an Eco-City</div>
    <div class="goal-text" id="goal-text"></div>
  </div>

  <div class="class-picker" id="class-picker"></div>
</div>

<!-- ══════════════════ MAIN SCREEN ══════════════════ -->
<div id="screen-main" class="screen">
  <div class="topbar">

<script>
// ═══════════════════════ QUESTION BANK (Family and Friends 2, Units 1-6) ═══════════════════════
// hint: array of tokens (static model sentence) OR a function(resolvedValue) -> tokens,
// used only when the question has a picture that resolves a concrete answer (color/number/object/position).

const SCENE_POS = {
  on:      { baseTop: "62%", objTop: "12%", objLeft: "50%", objScale: 1,    objZ: 2, baseZ: 1 },
  under:   { baseTop: "42%", objTop: "82%", objLeft: "50%", objScale: 0.85, objZ: 0, baseZ: 2 },
  next:    { baseTop: "50%", objTop: "50%", objLeft: "80%", objScale: 1,    objZ: 1, baseZ: 1 },
  behind:  { baseTop: "55%", objTop: "32%", objLeft: "28%", objScale: 0.78, objZ: 0, baseZ: 2 },
  infront: { baseTop: "45%", objTop: "65%", objLeft: "65%", objScale: 1.15, objZ: 2, baseZ: 1 },
};

const COLOR_PALETTE = [
  { name: "red", hex: "#ef4444" },
  { name: "blue", hex: "#3b82f6" },
  { name: "green", hex: "#22c55e" },
  { name: "yellow", hex: "#eab308" },
  { name: "pink", hex: "#ec4899" },
  { name: "purple", hex: "#a855f7" },
  { name: "orange", hex: "#f97316" },
  { name: "brown", hex: "#92400e" },
  { name: "black", hex: "#111827" },
];

const NUM_WORDS = {
  1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six", 7: "seven", 8: "eight", 9: "nine", 10: "ten",
  20: "twenty", 30: "thirty", 40: "forty", 50: "fifty", 60: "sixty", 70: "seventy", 80: "eighty", 90: "ninety", 100: "one hundred",
};
function numWord(n) { return NUM_WORDS[n] || String(n); }

// Picks a random Yes/No model answer every time the question is drawn — kids need to
// hear both forms, not just "yes" over and over.
function yn(yesTokens, noTokens) {
  return () => (Math.random() < 0.5 ? yesTokens : noTokens);
}

// ═══════════════════════ STATE ═══════════════════════
let currentClass = null;
let state = null; // { points, pool1, pool2, callCount, current }
let currentMode = null;
let lastQuestion = null;

let hintRevealed = 0;

// Storage prefix stays "starTalk_" from the app's old name — renaming it would orphan
// every class's saved points.
function storageKey(cls) { return "starTalk_" + cls.replace("/", "_"); }

function freshState() {
  return {
    points: 0,
    pool1: Array.from({ length: 15 }, (_, i) => i + 1),   // students 1-15
    pool2: Array.from({ length: 18 }, (_, i) => i + 16),  // students 16-33
    callCount: 0,
    current: null,
  };
}

function loadState(cls) {
  const raw = localStorage.getItem(storageKey(cls));
  if (raw) {
    try { return JSON.parse(raw); } catch (e) { /* fallthrough */ }
  }
  return freshState();
}

function saveState() {
  localStorage.setItem(storageKey(currentClass), JSON.stringify(state));
}

// ═══════════════════════ NAV ═══════════════════════
// Only the class being trialled is listed. Add "2/1" / "2/3" back here to bring them in —
// each class keeps its own points and its own city under its own storage key.
const CLASSES = ["2/2"];

function openClass(cls) {
  currentClass = cls;
  state = loadState(cls);
  document.getElementById("class-label").textContent = cls;
  document.getElementById("settings-class-label").textContent = cls;
  showScreen("screen-main");
  resetToCallStage();
  updateJarUI();
  updateCalledCounter();
}

document.getElementById("btn-back").addEventListener("click", () => {
  renderClassPicker();   // the class we just left may have earned upgrades
  showScreen("screen-start");
});

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ═══════════════════════ CALL STUDENT ═══════════════════════
function currentPool() {
  return state.callCount % 2 === 0 ? state.pool1 : state.pool2;
}

function refillPoolsIfNeeded() {
  if (state.pool1.length === 0 && state.pool2.length === 0) {
    state.pool1 = Array.from({ length: 15 }, (_, i) => i + 1);
    state.pool2 = Array.from({ length: 18 }, (_, i) => i + 16);
    showToast("🎉 Everyone's had a turn! New round starting.");
    return true;
  }
  return false;
}

// Slot-machine style: fast ticks that gradually slow down, like a real spinner settling.
const ROLL_DELAYS = [50, 50, 55, 60, 65, 75, 85, 95, 110, 130, 150, 170];

document.getElementById("btn-call").addEventListener("click", () => {
  refillPoolsIfNeeded();
  let pool = currentPool();
  if (pool.length === 0) {
    // this half is empty, borrow from the other half so the class keeps moving
    pool = state.pool1.length ? state.pool1 : state.pool2;
  }
  const idx = Math.floor(Math.random() * pool.length);
  const chosen = pool[idx];

  // switch to the student stage FIRST so the rolling number is actually visible,
  // and hide the reroll/mode buttons until the roll finishes landing
  document.getElementById("stage-call").classList.add("hidden");
  document.getElementById("stage-question").classList.add("hidden");
  document.getElementById("stage-student").classList.remove("hidden");
  document.getElementById("btn-reroll").classList.add("hidden");
  document.querySelector(".mode-picker").classList.add("hidden");

  const display = document.getElementById("student-number");
  display.classList.remove("landed");
  display.classList.add("rolling");
  display.textContent = "?";

  function tick(i) {
    display.textContent = Math.floor(Math.random() * 33) + 1;
    playTick(i);
    if (i < ROLL_DELAYS.length - 1) {
      setTimeout(() => tick(i + 1), ROLL_DELAYS[i]);
    } else {
      setTimeout(land, ROLL_DELAYS[i]);
    }
  }

  function land() {
    pool.splice(idx, 1);
    state.callCount++;
    state.current = chosen;
    display.textContent = chosen;
    display.classList.remove("rolling");
    display.classList.add("landed");
    setTimeout(() => display.classList.remove("landed"), 600);
    renderStudentId(chosen);
    playReveal();
    spawnSparklesAround(display);
    saveState();
    updateCalledCounter();
    document.getElementById("btn-reroll").classList.remove("hidden");
    document.querySelector(".mode-picker").classList.remove("hidden");
  }

  tick(0);
});

document.getElementById("btn-reroll").addEventListener("click", () => {
  // put the current student back, pick someone else from the same half
  const pool = state.callCount % 2 === 1 ? state.pool1 : state.pool2; // pool used last call
  if (state.current !== null) pool.push(state.current);
  const idx = Math.floor(Math.random() * pool.length);
  const chosen = pool[idx];
  pool.splice(idx, 1);
  state.current = chosen;
  const display = document.getElementById("student-number");
  display.textContent = chosen;
  display.classList.remove("landed");
  void display.offsetWidth; // restart the bounce animation even if it just played
  display.classList.add("landed");
  setTimeout(() => display.classList.remove("landed"), 600);
  renderStudentId(chosen);
  playReveal();
  spawnSparklesAround(display);
  saveState();
});

function updateCalledCounter() {
  const remaining = state.pool1.length + state.pool2.length;
  const called = 33 - remaining;
  document.getElementById("called-counter").textContent = `${called} / 33 called this round`;
}

// Shows the called student's avatar + name below their number, using roster.js if it's
// loaded (see the <script src="roster.js"> tag above). Falls back to nothing — not an
// error — when roster.js isn't present, so star-talk.html still works standalone.
function renderStudentId(number) {
  const el = document.getElementById("student-id");
  if (typeof window.getStudent !== "function") { el.innerHTML = ""; return; }

  const info = window.getStudent(currentClass, number);
  const name = info && (info.nickname || info.first) ? (info.nickname || info.first) : "";
  const photoHtml = info && info.photoUrl
    ? `<img class="student-photo" src="${info.photoUrl}" alt="">`
    : (() => {
        const a = window.avatarFor ? window.avatarFor(currentClass, number) : null;
        return a ? `<span class="student-avatar" style="background:${a.color}">${a.emoji}</span>` : "";
      })();

  el.innerHTML = photoHtml + (name ? `<span>${name}</span>` : "");
}

// ═══════════════════════ MODE + QUESTION ═══════════════════════
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentMode = btn.dataset.mode;
    document.getElementById("question-badge").textContent = MODE_LABEL[currentMode];
    newQuestion();
    document.getElementById("stage-student").classList.add("hidden");
    document.getElementById("stage-question").classList.remove("hidden");
  });
});

function pickFrom(list) {
  let q;
  do { q = list[Math.floor(Math.random() * list.length)]; } while (list.length > 1 && q === lastQuestion);
  lastQuestion = q;
  return q;
}

// Word Order mode has no fixed "text" — the puzzle is a fresh shuffle of the
// correct-order hint tokens every time, so nobody can just memorize the layout.
function scrambleForOrder(tokens) {
  const words = tokens.map((t) => t.replace(/[.?!]+$/, ""));
  if (words.length < 2) return words.join(", ");
  let shuffled;
  do {
    shuffled = [...words];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
  } while (shuffled.every((w, i) => w === words[i]));
  return shuffled.join(", ");
}

function newQuestion() {
  const item = pickFrom(QUIZ[currentMode]);
  const text = currentMode === "order" ? scrambleForOrder(item.hint) : item.text;
  document.getElementById("question-text").textContent = text;
  const resolved = renderVisual(item.img);
  currentHintTokens = typeof item.hint === "function" ? (item.hint(resolved) || []) : (item.hint || []);
  hintRevealed = 0;
  renderHint();
}

document.getElementById("btn-shuffle").addEventListener("click", newQuestion);
document.getElementById("btn-hint").addEventListener("click", revealNextHintWord);
document.getElementById("btn-hide-hint").addEventListener("click", hideHint);

window.addEventListener("keydown", (e) => {
  const isSpace = e.code === "Space" || e.key === " " || e.key === "Spacebar";
  if (isSpace && !document.getElementById("stage-question").classList.contains("hidden")) {
    e.preventDefault();
    revealNextHintWord();
  }
}, true);

document.getElementById("btn-correct").addEventListener("click", () => {
  const pts = POINTS[currentMode];
  state.points += pts;
  saveState();
  spawnFloatingStars(pts);
  updateJarUI();
  playDing();
  setTimeout(resetToCallStage, 500);
});

document.getElementById("btn-skip").addEventListener("click", resetToCallStage);

function resetToCallStage() {
  document.getElementById("stage-question").classList.add("hidden");
  document.getElementById("stage-student").classList.add("hidden");
  document.getElementById("stage-call").classList.remove("hidden");
}

// ═══════════════════════ VISUAL AIDS ═══════════════════════
// Returns a "resolved value" (color name / number / picked word / scene mode) so the
// hint function can build a sentence that matches exactly what's shown on screen.
function renderVisual(spec) {
  const box = document.getElementById("question-visual");
  if (!spec) { box.innerHTML = ""; box.classList.add("hidden"); return undefined; }
  box.classList.remove("hidden");

  if (typeof spec === "string") {
    box.innerHTML = `<div class="emoji-visual">${spec}</div>`;
    return undefined;
  }
  if (spec.type === "pick") {
    const opt = spec.options[Math.floor(Math.random() * spec.options.length)];
    box.innerHTML = `<div class="emoji-visual">${opt.emoji}</div>`;
    return opt; // whole option, so hint() can read .word and/or .match
  }
  if (spec.type === "repeat") {
    const n = spec.min + Math.floor(Math.random() * (spec.max - spec.min + 1));
    box.innerHTML = `<div class="repeat-row">${Array(n).fill(`<span>${spec.emoji}</span>`).join("")}</div>`;
    return n;
  }
  if (spec.type === "color") {
    const c = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
    const textColor = c.name === "yellow" ? "#111827" : "#fff";
    box.innerHTML = `<div class="color-card" style="background:${c.hex};color:${textColor}">${spec.emoji}</div>`;
    return c.name;
  }
  if (spec.type === "number") {
    const n = spec.options[Math.floor(Math.random() * spec.options.length)];
    box.innerHTML = `<div class="number-card"><span class="number-emoji">${spec.emoji}</span><span class="number-value">${n}</span></div>`;
    return n;
  }
  if (spec.type === "scene") {
    const mode = spec.modes[Math.floor(Math.random() * spec.modes.length)];
    const P = SCENE_POS[mode];
    box.innerHTML = `
      <div class="scene-box">
        <span class="scene-emoji" style="top:${P.baseTop};left:50%;font-size:3.4rem;z-index:${P.baseZ};transform:translate(-50%,-50%);">${spec.base}</span>
        <span class="scene-emoji" style="top:${P.objTop};left:${P.objLeft};font-size:${3.4 * P.objScale}rem;z-index:${P.objZ};transform:translate(-50%,-50%);">${spec.obj}</span>
      </div>`;
    return mode;
  }
  box.innerHTML = "";
  box.classList.add("hidden");
  return undefined;
}

// ═══════════════════════ SENTENCE HINT ═══════════════════════
function renderHint() {
  const row = document.getElementById("hint-row");
  if (!currentHintTokens.length) { row.innerHTML = ""; row.classList.add("hidden"); return; }
  row.classList.remove("hidden");
  row.innerHTML = currentHintTokens.map((tok, i) =>
    i < hintRevealed
      ? `<span class="hint-chip revealed">${tok}</span>`
      : `<span class="hint-chip">···</span>`
  ).join("");
}

function revealNextHintWord() {
  if (document.getElementById("stage-question").classList.contains("hidden")) return;
  if (!currentHintTokens.length) return;
  if (hintRevealed < currentHintTokens.length) {
    hintRevealed++;
    renderHint();
  }
}

function hideHint() {
  hintRevealed = 0;
  renderHint();
}


// ═══════════════════════ ECO-CITY (shared class goal) ═══════════════════════
// One full jar (JAR_CAPACITY points) unlocks one city upgrade; ten upgrades finish a city
// and a fresh polluted one takes its place. Everything here is derived from state.points,
// so no new saved field is needed and classes that already have points keep their progress.
const CITY_UPGRADES = [
  { flag: "trash-gone", emoji: "🗑️", label: "Trash cleaned up!" },
  { flag: "tree-on",    emoji: "🌳", label: "Trees planted!" },
  { flag: "park-on",    emoji: "🏞️", label: "The park is green!" },
  { flag: "river-on",   emoji: "🌊", label: "The river is clean!" },
  { flag: "flower-on",  emoji: "🌸", label: "Flowers are blooming!" },
  { flag: "bike-on",    emoji: "🚲", label: "A bike lane for the city!" },
  { flag: "bin-on",     emoji: "♻️", label: "Recycling bins!" },
  { flag: "solar-on",   emoji: "☀️", label: "Solar panels on the roofs!" },
  { flag: "turbine-on", emoji: "💨", label: "Wind turbines on the hills!" },
  { flag: "city-clean", emoji: "🌈", label: "The smog is gone — Eco-City complete!" },
];
const UPGRADES_PER_CITY = CITY_UPGRADES.length;

// points defaults to the open class, but any class's total can be passed in (start screen).
// `state` is still null before a class is opened — demo mode runs from the start screen too.
function openPoints() { return state ? state.points : 0; }
function totalUpgrades(points = openPoints()) { return Math.floor(points / JAR_CAPACITY); }
function citiesBuilt(points = openPoints())   { return Math.floor(totalUpgrades(points) / UPGRADES_PER_CITY); }

// 0 = untouched polluted city, 10 = finished city still on screen.
// The 10th upgrade keeps the finished city up; the 11th starts the next one at level 1.
function cityLevel(points = openPoints()) {
  const t = totalUpgrades(points);
  return t === 0 ? 0 : ((t - 1) % UPGRADES_PER_CITY) + 1;
}

// Start screen: show every class where its own city stands right now.
// Builds the start-screen button(s) from CLASSES, each one showing where that class's city
// stands right now. The click handler is attached to the button as it is created, so the
// button and its behaviour can never get out of sync.
function renderClassPicker() {
  document.getElementById("goal-text").innerHTML =
    `Every good answer earns stars. ${JAR_CAPACITY} ⭐ fill the jar,<br>` +
    `and a full jar makes our city greener.<br>` +
    `<strong>${UPGRADES_PER_CITY} upgrades = a clean Eco-City!</strong>`;

  const picker = document.getElementById("class-picker");
  picker.innerHTML = "";

  CLASSES.forEach(cls => {
    const points = loadState(cls).points || 0;
    const built = citiesBuilt(points);
    const btn = document.createElement("button");
    btn.className = "class-btn";
    btn.innerHTML =
      `<span class="class-name">${cls}</span>` +
      `<span class="class-progress">` +
        `<span class="lvl">🏙️ ${cityLevel(points)}/${UPGRADES_PER_CITY}${built > 0 ? ` · 🏆 ${built}` : ""}</span>` +
        `<span class="pts">${points} ⭐</span>` +
      `</span>` +
      `<span class="class-go">▶ Start the lesson</span>`;
    btn.addEventListener("click", () => openClass(cls));
    picker.appendChild(btn);
  });
}

function applyCityLayers(level) {
  if (level === undefined) level = cityLevel();
  const svg = document.getElementById("cityscape");
  CITY_UPGRADES.forEach((u, i) => svg.classList.toggle(u.flag, i < level));
  document.getElementById("city-bar-fill").style.width = (level / UPGRADES_PER_CITY) * 100 + "%";
  document.getElementById("city-level-text").textContent = "Level " + level + "/" + UPGRADES_PER_CITY;
  const built = inDemo() ? 0 : citiesBuilt();   // a demo run has no completed cities behind it
  document.getElementById("city-built-text").textContent = built > 0 ? "🏆 Cities built: " + built : "";
}

function openCity() {
  document.getElementById("city-banner").classList.add("hidden");
  document.getElementById("city-overlay").classList.remove("hidden");
  applyCityLayers();
}

function closeCity() {
  if (inDemo()) endDemo();
  document.getElementById("city-overlay").classList.add("hidden");
  document.getElementById("city-banner").classList.add("hidden");
}

// n = number of completed jars = total upgrades earned so far.
function celebrateCityUpgrade(n) {
  const level = cityLevel();
  const upgrade = CITY_UPGRADES[level - 1];
  const banner = document.getElementById("city-banner");

  banner.classList.add("hidden");
  document.getElementById("city-overlay").classList.remove("hidden");
  applyCityLayers(level - 1);   // show the city as it was, so the new layer can animate in

  setTimeout(() => {
    applyCityLayers(level);
    playFanfare();
    const startingOver = level === 1 && citiesBuilt() > 0;
    banner.innerHTML = startingOver
      ? '<span class="city-banner-emoji">' + upgrade.emoji + '</span> A new city needs your help!<small>' + upgrade.label + '</small>'
      : '<span class="city-banner-emoji">' + upgrade.emoji + '</span> ' + upgrade.label;
    banner.classList.remove("hidden");
    if (level === UPGRADES_PER_CITY) {
      burstConfetti();
      setTimeout(burstConfetti, 700);
      setTimeout(burstConfetti, 1400);
    }
  }, 500);
}

function playFanfare() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "triangle";
    const t = ctx.currentTime + i * 0.12;
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.2);
  });
}

document.getElementById("btn-city").addEventListener("click", openCity);
document.getElementById("btn-close-city").addEventListener("click", closeCity);

// ═══════════════════════ DEMO MODE (for showing the project) ═══════════════════════
// Walks the city through its 10 upgrades on demand. It only ever passes an explicit level to
// applyCityLayers and never calls saveState(), so a demo run cannot touch a class's real points.
// Open it from Settings, or straight from a link: star-talk.html?demo
let demoLevel = null;      // null = not demoing; 0-10 = the level being shown
let demoTimer = null;

function inDemo() { return demoLevel !== null; }

function startDemo() {
  stopDemoPlayback();
  demoLevel = 0;
  document.getElementById("settings-modal").classList.add("hidden");
  document.getElementById("demo-bar").classList.remove("hidden");
  document.getElementById("demo-badge").classList.remove("hidden");
  document.getElementById("city-overlay").classList.remove("hidden");
  renderDemo(false);
}

// Tears the demo down without closing the overlay (closeCity does that part).
function endDemo() {
  stopDemoPlayback();
  demoLevel = null;
  document.getElementById("demo-bar").classList.add("hidden");
  document.getElementById("demo-badge").classList.add("hidden");
  applyCityLayers();   // back to whatever the real class city is
}

function renderDemo(announce) {
  applyCityLayers(demoLevel);
  const banner = document.getElementById("city-banner");
  if (announce && demoLevel > 0) {
    const u = CITY_UPGRADES[demoLevel - 1];
    banner.innerHTML = `<span class="city-banner-emoji">${u.emoji}</span> ${u.label}`;
    banner.classList.remove("hidden");
    playFanfare();
    if (demoLevel === UPGRADES_PER_CITY) burstConfetti();
  } else {
    banner.classList.add("hidden");
  }
}

function demoStep(delta) {
  stopDemoPlayback();
  const next = Math.min(UPGRADES_PER_CITY, Math.max(0, demoLevel + delta));
  const moved = next !== demoLevel;
  demoLevel = next;
  renderDemo(moved && delta > 0);
}

function playDemo() {
  stopDemoPlayback();
  demoLevel = 0;
  renderDemo(false);
  demoTimer = setInterval(() => {
    if (demoLevel >= UPGRADES_PER_CITY) { stopDemoPlayback(); return; }
    demoLevel++;
    renderDemo(true);
  }, 2200);   // long enough for each layer's animation to finish before the next one
}

function stopDemoPlayback() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
}

document.getElementById("btn-demo").addEventListener("click", startDemo);
document.getElementById("demo-play").addEventListener("click", playDemo);
document.getElementById("demo-next").addEventListener("click", () => demoStep(1));
document.getElementById("demo-prev").addEventListener("click", () => demoStep(-1));
document.getElementById("demo-reset").addEventListener("click", () => { stopDemoPlayback(); demoLevel = 0; renderDemo(false); });
document.getElementById("demo-exit").addEventListener("click", closeCity);

// Arrow keys drive the demo — most presentation remotes send exactly these.
window.addEventListener("keydown", (e) => {
  if (!inDemo()) return;
  if (e.key === "ArrowRight") { e.preventDefault(); demoStep(1); }
  if (e.key === "ArrowLeft")  { e.preventDefault(); demoStep(-1); }
});

if (location.search.includes("demo")) startDemo();

// ═══════════════════════ JAR / POINTS UI ═══════════════════════
// Each completed jar advances to the next color in this cycle, so kids can see
// at a glance which "round" the class is on, not just the star count.
const JAR_COLORS = [
  { name: "Gold", from: "#fde68a", to: "#fbbf24" },
  { name: "Teal", from: "#99f6e4", to: "#2dd4bf" },
  { name: "Pink", from: "#fbcfe8", to: "#f472b6" },
  { name: "Purple", from: "#ddd6fe", to: "#a78bfa" },
  { name: "Green", from: "#bbf7d0", to: "#4ade80" },
  { name: "Orange", from: "#fed7aa", to: "#fb923c" },
];

function updateJarUI() {
  const jarsCompleted = Math.floor(state.points / JAR_CAPACITY);
  const remainder = state.points % JAR_CAPACITY;
  const fillPct = (remainder / JAR_CAPACITY) * 100;
  const color = JAR_COLORS[jarsCompleted % JAR_COLORS.length];

  document.getElementById("jar").style.borderColor = color.to;
  const fillEl = document.getElementById("jar-fill");
  fillEl.style.height = fillPct + "%";
  fillEl.style.background = `linear-gradient(180deg, ${color.from}, ${color.to})`;
  document.getElementById("jar-total").textContent = state.points + " ⭐";
  document.getElementById("jar-total").style.color = color.to;
  const built = citiesBuilt();
  document.getElementById("jar-badges").innerHTML =
    `🏙️ ${cityLevel()}/${UPGRADES_PER_CITY}` + (built > 0 ? ` · 🏆 ${built}` : "");

  if (state._lastJars === undefined) state._lastJars = jarsCompleted;
  const unlockedUpgrade = jarsCompleted > state._lastJars;
  state._lastJars = jarsCompleted;

  // On an upgrade the celebration owns the city animation; otherwise just keep it in sync
  // (class switch, points reset).
  if (unlockedUpgrade) celebrateJar(jarsCompleted);
  else applyCityLayers();
}

function celebrateJar(n) {
  const justFilled = JAR_COLORS[(n - 1) % JAR_COLORS.length].name;
  const next = JAR_COLORS[n % JAR_COLORS.length].name;
  showToast(`🎉 ${justFilled} jar full! Next up: the ${next} jar!`);
  burstConfetti();
  celebrateCityUpgrade(n);   // a full jar buys one upgrade for the class city
}

function spawnFloatingStars(count) {
  const rect = document.getElementById("btn-correct").getBoundingClientRect();
  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");
    star.className = "float-star";
    star.textContent = "⭐";
    star.style.left = (rect.left + rect.width / 2 + (Math.random() * 60 - 30)) + "px";
    star.style.top = rect.top + "px";
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 1200);
  }
}

function burstConfetti() {
  const emojis = ["🎉", "⭐", "✨", "🎊"];
  for (let i = 0; i < 30; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.animationDuration = (1.5 + Math.random() * 1.5) + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.getElementById("toast-container").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// tiny WebAudio sounds, no external files — one shared context, reused everywhere
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playDing() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(880, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
  g.gain.setValueAtTime(0.2, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.3);
}

// short rising blip played on every roll tick — pitch climbs a little each time to build anticipation
function playTick(i) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = "square";
  o.frequency.setValueAtTime(500 + i * 18, ctx.currentTime);
  g.gain.setValueAtTime(0.1, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.06);
}

// cheerful 3-note chime played when the randomizer lands on a student
function playReveal() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const t0 = ctx.currentTime + i * 0.09;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.001, t0);
    g.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + 0.3);
  });
}

// little sparkle burst around any element (used when a student is called)
function spawnSparklesAround(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const emojis = ["✨", "⭐", "🎉"];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("div");
    s.className = "float-star";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 70;
    s.style.left = (cx + Math.cos(angle) * dist) + "px";
    s.style.top = (cy + Math.sin(angle) * dist) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

    state.points = 0;
    state._lastJars = 0;

    updateJarUI();
    document.getElementById("settings-modal").classList.add("hidden");
  }
});
