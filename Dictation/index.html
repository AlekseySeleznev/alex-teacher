<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Dictation Machine - Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Select Unit 📚</h1>
        <p>Choose the dictation you want to run today:</p>
        <!-- Buttons are generated from js/data.js -->
        <div id="unit-list" class="unit-list"></div>
    </div>

    <script src="js/data.js"></script>
    <script>
        // Numeric unit keys come first in ascending order, "final" last.
        const list = document.getElementById('unit-list');
        Object.keys(dictationData).forEach((key) => {
            const btn = document.createElement('button');
            btn.textContent = dictationData[key].title;
            if (key === 'final') btn.className = 'btn-final';
            btn.addEventListener('click', () => {
                window.location.href = 'dictation.html?unit=' + encodeURIComponent(key);
            });
            list.appendChild(btn);
        });
    </script>
</body>
</html>
